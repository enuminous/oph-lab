name: OPH research readouts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-research.txt
      - run: python -m pip install -r requirements-research.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_research_contracts.py
      - run: python scripts/analyze_oph_n2_pilot.py docs/data/oph_n2_pilot_v1 --check docs/data/oph_n2_pilot_v1/analysis.json
      - run: python scripts/oph_observer_contract.py --check docs/data/oph_observer_contract.json
      - run: python scripts/oph_efmw_continuum_demo.py
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
